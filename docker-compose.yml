services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraguago-api
    restart: unless-stopped
    command: npm run start:dev
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fraguago-network

  postgres:
    image: postgres:16-alpine
    container_name: fraguago-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fraguago-network

volumes:
  postgres_data:

networks:
  fraguago-network:
    driver: bridge