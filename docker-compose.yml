services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraguago-api
    restart: unless-stopped
    # El volumen /app/node_modules sobrevive a los rebuilds y conserva el
    # cliente de Prisma viejo: se regenera y se migra en cada arranque para
    # que siempre coincida con schema.prisma.
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run start:dev"
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      # Pub/sub de eventos en tiempo real (aforo, retos) entre instancias.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fraguago-network

  postgres:
    image: postgres:16-alpine
    container_name: fraguago-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fraguago-network

  redis:
    image: redis:7-alpine
    container_name: fraguago-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fraguago-network

volumes:
  postgres_data:

networks:
  fraguago-network:
    driver: bridge